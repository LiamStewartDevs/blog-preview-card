<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Figtree:ital,wght@0,300..900;1,300..900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Blog preview card</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: hsl(47, 88%, 63%);
      font-family: "Figtree";
    }

    .card {
      position: relative;
      background-color: hsl(0, 0%, 100%);
      width: 400px;
      height: 560px;
      display: grid;
      grid-template-rows: auto;
      grid-template-columns: 40px auto;
      padding: 2rem;
      border: 1.5px solid black;
      border-radius: 1.5rem;
      box-shadow: 10px 10px hsl(0, 0%, 7%);
    }

    .tag {
      margin-top: 30px;
      margin-bottom: 0;
      font-weight: 800;
    }

    .date {
      font-weight: 500;
    }

    .full-name {
      font-weight: 800;
      padding-left: 15px;
      font-size: 1.2rem;
    }

    .abstract {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 1rem;
    }

    .grid-item {
      grid-column: span 2;
    }

    .user {
      width: 100%;
      align-self: center;
    }

    .attribution {
      font-size: 1rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }

    span {
      background-color: hsl(47, 88%, 63%);
      display: inline-block;
      padding: 5px 10px;
      border-radius: .2rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-top: 0;
      margin-bottom: 0;
    }

    .description {
      font-size: 1.3rem;
      line-height: 2rem;
      color: hsl(0, 0%, 42%);
    }

    footer {
      position: absolute;
      margin-top: 750px;
    }

    @media (max-width: 425px) {
      body {
        padding: 0;
        margin: 0;
      }

      .card {
        width: 300px;
        height: 480px;
        padding: 1.5rem;
        grid-template-rows: 200px auto;
      }

      .tag {
        margin-top: 20px;
      }

      h1 {
        font-size: 1.5rem;
      }

    }

    @media (max-width: 375px) {
      .card {
        margin: auto 25px;
      }
      
      .description {
        font-size: 1rem;
      }

      .full-name {
        font-size: 1rem;
      }
    }

    @media (max-width: 320px) {
      .card {
        grid-template-rows: 180px auto;
        margin: auto 20px;
      }

      h1 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <img class="grid-item abstract" src="assets/images/illustration-article.svg" alt="an illustrated image">
    <p class="grid-item tag"><span>Learning</span></p>
    <p class="grid-item date">Published 21 Dec 2023</p>
    <h1 class="grid-item title"> HTML & CSS foundations</h1>
    <p class="grid-item description">These languages are the backbone of every website, defining structure,
      content, and presentation.</p>
    <img class="user" src="assets/images/image-avatar.webp" alt="an image of a person">
    <p class="full-name"> Greg Hooper</p>
  </div>
  <footer>
    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
      Coded by <a href="#">Liam Stewart</a>.
    </div>
  </footer>
</body>

</html>
